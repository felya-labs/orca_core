name: Run Tests on Pull Request

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.11.16'

      - name: Install dependencies
        run: |
          uv sync --locked --group dev --group build

      - name: Run Tests
        run: |
          uv run pytest

      - name: Derive reproducible build timestamp from source commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Validate and hydrate locked build toolchain
        run: |
          uv lock --check --offline
          uv run --no-sync python tools/validate_build_toolchain.py
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --dest build/build-wheelhouse \
            --requirement compliance/build-toolchain-constraints.txt

      - name: Build reproducible release candidate twice
        run: |
          uv build --wheel --offline --no-index \
            --find-links build/build-wheelhouse \
            --cache-dir build/empty-cache-a \
            --build-constraints compliance/build-toolchain-constraints.txt \
            --require-hashes \
            --out-dir build/candidate-a
          uv build --wheel --offline --no-index \
            --find-links build/build-wheelhouse \
            --cache-dir build/empty-cache-b \
            --build-constraints compliance/build-toolchain-constraints.txt \
            --require-hashes \
            --out-dir build/candidate-b
          cmp build/candidate-a/*.whl build/candidate-b/*.whl
          uv run --no-sync python tools/verify_release_candidate.py \
            build/candidate-a/*.whl \
            --comparison-wheel build/candidate-b/*.whl \
            --evidence-out build/release-candidate-evidence.json

      - name: Generate deterministic runtime-lock SBOM twice
        run: |
          uv run --no-sync python tools/generate_runtime_sbom.py \
            --sbom-out build/compliance-a/runtime.cdx.json \
            --status-out build/compliance-a/status.json
          uv run --no-sync python tools/generate_runtime_sbom.py \
            --sbom-out build/compliance-b/runtime.cdx.json \
            --status-out build/compliance-b/status.json
          cmp build/compliance-a/runtime.cdx.json build/compliance-b/runtime.cdx.json
          cmp build/compliance-a/status.json build/compliance-b/status.json
          uv run --no-sync python tools/validate_license_provenance.py \
            --sbom build/compliance-a/runtime.cdx.json
          uv run --no-sync python tools/validate_license_provenance.py \
            --sbom build/compliance-b/runtime.cdx.json
